name: Build and Deploy to Harbor (Production)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # ============================================================================
  # 1. CI Stage: Validate Backend Tests and Frontend Build
  # ============================================================================
  validate:
    name: Test & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: |
          npm ci
          npm ci --prefix client

      - name: Run Backend Test Suite
        run: npm test

      - name: Verify Frontend Compilation
        run: npm run client:build

  # ============================================================================
  # 2. CD Stage: Build & Push Docker Image to Harbor
  # ============================================================================
  build-and-push:
    name: Build & Push to Harbor
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    environment: production

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.HARBOR_HOST || secrets.HARBOR_HOST }}
          username: ${{ vars.HARBOR_USERNAME || secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.HARBOR_HOST || secrets.HARBOR_HOST }}/${{ vars.HARBOR_PROJECT || secrets.HARBOR_PROJECT }}/cryptiva
          tags: |
            type=sha,format=long,priority=1000
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }},priority=100

      - name: Build and Push Docker Image to Harbor
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 3. CD Stage: Deploy to Production Kubernetes
  # ============================================================================
  deploy:
    name: Deploy to Kubernetes
    if: github.event_name == 'push'
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Configure Kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          set -eu

          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_DATA" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

          kubectl get nodes

      - name: Ensure Namespace Exists
        run: |
          kubectl create namespace cryptiva \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Update Kustomize Image Tag
        env:
          HARBOR_HOST: ${{ vars.HARBOR_HOST || secrets.HARBOR_HOST }}
          HARBOR_PROJECT: ${{ vars.HARBOR_PROJECT || secrets.HARBOR_PROJECT }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          set -eu

          IMAGE_PATH="${HARBOR_HOST}/${HARBOR_PROJECT}/cryptiva"

          cd k8s/overlays/production
          kustomize edit set image "cryptiva=${IMAGE_PATH}:${IMAGE_TAG}"

          echo "Prepared production image tag: ${IMAGE_TAG}"

      - name: Apply Kustomize Manifests
        run: |
          kubectl apply -k k8s/overlays/production --validate=false

      - name: Monitor Kubernetes Rollout
        run: |
          kubectl rollout status deployment/cryptiva \
            --namespace=cryptiva \
            --timeout=180s

          echo "Kubernetes rollout completed successfully."

      - name: Verify Production Health
        run: |
          set -eu

          for endpoint in \
            "https://cryptiva.smolelab.com/health/live" \
            "https://cryptiva.smolelab.com/health/ready"
          do
            echo "Checking ${endpoint}"
            success=false

            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error \
                --max-time 10 "$endpoint"; then
                echo
                success=true
                break
              fi

              if [ "$attempt" -lt 12 ]; then
                sleep 5
              fi
            done

            if [ "$success" != true ]; then
              echo "Health check failed: ${endpoint}"
              exit 1
            fi
          done

          echo "Production health checks passed."

      - name: Report Deployment Details
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "Deployment completed successfully."
          echo "Commit: ${COMMIT_SHA}"
          echo "Image tag: ${IMAGE_TAG}"
          echo "Environment: production"
