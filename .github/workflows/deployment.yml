name: Build and Deploy to Harbor (Production)

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read

jobs:
  # ============================================================================
  # 1. CI Stage: Validate Backend Tests and Frontend Build with Node.js 22
  # ============================================================================
  validate:
    name: Test & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          npm ci --prefix client

      - name: Run Backend Test Suite
        run: npm test

      - name: Verify Frontend Compilation
        run: npm run client:build

  # ============================================================================
  # 2. CD Stage: Build & Push Docker Image to Harbor Registry
  # ============================================================================
  build-and-push:
    name: Build & Push to Harbor
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Supports values from either Variables or Secrets
      - name: Log in to Harbor Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.HARBOR_HOST || secrets.HARBOR_HOST }}
          username: ${{ vars.HARBOR_USERNAME || secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.HARBOR_HOST || secrets.HARBOR_HOST }}/${{ vars.HARBOR_PROJECT || secrets.HARBOR_PROJECT }}/cryptiva
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Build and Push Docker Image to Harbor
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 3. Deploy Stage: Apply Kubernetes Manifests & Verify Rollout in 'cryptiva' Namespace
  # ============================================================================
  deploy:
    name: Deploy to Kubernetes
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Set up Kustomize to dynamically update image tags
      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      # Write Kubeconfig directly from env
      - name: Configure Kubeconfig & Diagnose Connection
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_DATA" > ~/.kube/config
          chmod 600 ~/.kube/config

          SERVER_URL=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')
          TOKEN=$(kubectl config view --minify --raw -o jsonpath='{.users[0].user.token}')
          echo "Connecting to Server: $SERVER_URL"

          echo "--- DIAGNOSTIC: Checking response from Kubernetes endpoint ---"
          curl -k -i -s -H "Authorization: Bearer $TOKEN" "$SERVER_URL/api" | head -n 35 || true
          echo "--- END DIAGNOSTIC ---"

          kubectl get nodes

      # Ensure target namespace 'cryptiva' exists
      - name: Ensure Namespace Exists
        run: |
          kubectl create namespace cryptiva --dry-run=client -o yaml | kubectl apply -f -

      # Update Kustomize production overlay with the built Harbor image and tag
      - name: Update Kustomize Image Tag
        run: |
          cd k8s/overlays/production
          IMAGE_PATH="${{ vars.HARBOR_HOST || secrets.HARBOR_HOST }}/${{ vars.HARBOR_PROJECT || secrets.HARBOR_PROJECT }}/cryptiva"
          IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}"
          kustomize edit set image cryptiva="${IMAGE_PATH}:${IMAGE_TAG}"

      # Apply Kustomize production overlay to the 'cryptiva' namespace
      - name: Apply Kustomize Manifests
        run: |
          kubectl apply -k k8s/overlays/production --validate=false

      # Force Kubernetes to pull the new image from Harbor and perform a rolling restart
      - name: Trigger Rolling Restart
        run: |
          echo "Triggering rolling update to pull fresh image from Harbor..."
          kubectl rollout restart deployment/cryptiva --namespace=cryptiva

      # Monitor rolling update in the 'cryptiva' namespace
      - name: Monitor Kubernetes Rollout Status
        run: |
          echo "Watching deployment rollout in 'cryptiva' namespace..."
          kubectl rollout status deployment/cryptiva --namespace=cryptiva --timeout=180s
          echo "Deployment rollout in 'cryptiva' namespace completed successfully!"

