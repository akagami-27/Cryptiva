<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Cryptiva activity log"
    >

    <meta
        name="robots"
        content="noindex, nofollow, noarchive"
    >

    <meta
        name="referrer"
        content="no-referrer"
    >

    <title>
        Activity — Cryptiva
    </title>


    <!-- =========================================================
         GLOBAL STYLES
         ========================================================= -->

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

    <link
        rel="stylesheet"
        href="/css/sidebar.css"
    >

    <link
        rel="stylesheet"
        href="/css/activity.css?v=20261007-2300"
    >


    <!-- =========================================================
         CSRF
         ========================================================= -->

    <meta
        name="csrf-token"
        content=""
    >

</head>


<body class="activity-page">


    <!-- =========================================================
         MAIN
         ========================================================= -->

    <main class="activity-shell">


        <section class="activity-content">


            <!-- =====================================================
                 HEADER
                 ===================================================== -->

            <header class="activity-header">

                <div class="activity-header-copy">


                    <div class="activity-eyebrow">

                        <span class="activity-eyebrow-dot"></span>

                        ACCOUNT ACTIVITY

                    </div>


                    <h1>
                        Activity
                    </h1>


                    <p>
                        Review your recent account and file activity.
                    </p>

                </div>


                <button
                    type="button"
                    class="activity-refresh-button"
                    id="activity-refresh"
                >

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        aria-hidden="true"
                    >

                        <path
                            d="M20 11a8.1 8.1 0 0 0-14.9-4M4 5v4h4"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />

                        <path
                            d="M4 13a8.1 8.1 0 0 0 14.9 4M20 19v-4h-4"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />

                    </svg>

                    <span>
                        Refresh
                    </span>

                </button>

            </header>



            <!-- =====================================================
                 ACTIVITY STATS
                 ===================================================== -->

            <section class="activity-stats">


                <article class="activity-stat-card">

                    <div class="activity-stat-icon purple">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            aria-hidden="true"
                        >

                            <path
                                d="M5 12h4l2-7 3 14 2-7h3"
                                stroke="currentColor"
                                stroke-width="1.7"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />

                        </svg>

                    </div>


                    <div class="activity-stat-copy">

                        <span>
                            Total Activities
                        </span>

                        <strong id="activity-total">
                            —
                        </strong>

                    </div>

                </article>



                <article class="activity-stat-card">

                    <div class="activity-stat-icon green">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            aria-hidden="true"
                        >

                            <path
                                d="m5 12 4 4L19 6"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />

                        </svg>

                    </div>


                    <div class="activity-stat-copy">

                        <span>
                            Successful
                        </span>

                        <strong id="activity-success">
                            —
                        </strong>

                    </div>

                </article>



                <article class="activity-stat-card">

                    <div class="activity-stat-icon red">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            aria-hidden="true"
                        >

                            <circle
                                cx="12"
                                cy="12"
                                r="8.5"
                                stroke="currentColor"
                                stroke-width="1.7"
                            />

                            <path
                                d="m9 9 6 6M15 9l-6 6"
                                stroke="currentColor"
                                stroke-width="1.7"
                                stroke-linecap="round"
                            />

                        </svg>

                    </div>


                    <div class="activity-stat-copy">

                        <span>
                            Failed / Blocked
                        </span>

                        <strong id="activity-failed">
                            —
                        </strong>

                    </div>

                </article>


            </section>



            <!-- =====================================================
                 ACTIVITY PANEL
                 ===================================================== -->

            <section class="activity-panel">


                <!-- =================================================
                     PANEL HEADER
                     ================================================= -->

                <div class="activity-panel-header">


                    <div class="activity-panel-heading">

                        <div class="activity-section-label">

                            <span class="activity-section-label-dot"></span>

                            AUDIT TRAIL

                        </div>


                        <h2>
                            Recent Activity
                        </h2>


                        <p>
                            Security and account actions recorded by Cryptiva.
                        </p>

                    </div>


                </div>



                <!-- =================================================
                     FILTERS
                     ================================================= -->

                <div class="activity-toolbar">


                    <div class="activity-search">

                        <svg
                            viewBox="0 0 24 24"
                            fill="none"
                            aria-hidden="true"
                        >

                            <circle
                                cx="11"
                                cy="11"
                                r="6.5"
                                stroke="currentColor"
                                stroke-width="1.8"
                            />

                            <path
                                d="m16 16 4 4"
                                stroke="currentColor"
                                stroke-width="1.8"
                                stroke-linecap="round"
                            />

                        </svg>


                        <input
                            type="search"
                            id="activity-search"
                            placeholder="Search activity..."
                            autocomplete="off"
                            spellcheck="false"
                            aria-label="Search activity"
                        >

                    </div>



                    <div class="activity-filter">

                        <select
                            id="activity-action"
                            aria-label="Filter by activity"
                        >

                            <option value="">
                                All activities
                            </option>

                            <option value="login_success">
                                Login successful
                            </option>

                            <option value="login_failed">
                                Login failed
                            </option>

                            <option value="logout">
                                Logout
                            </option>

                            <option value="file_upload">
                                File upload
                            </option>

                            <option value="file_download">
                                File download
                            </option>

                            <option value="file_delete">
                                File delete
                            </option>

                            <option value="share_created">
                                Share created
                            </option>

                            <option value="share_updated">
                                Share updated
                            </option>

                            <option value="share_accessed">
                                Share accessed
                            </option>

                            <option value="share_password_failed">
                                Share password failed
                            </option>

                            <option value="share_download">
                                Share download
                            </option>

                            <option value="share_download_limit_reached">
                                Download limit reached
                            </option>

                            <option value="share_expired">
                                Share expired
                            </option>

                            <option value="share_revoked">
                                Share revoked
                            </option>

                            <option value="password_changed">
                                Password changed
                            </option>

                            <option value="profile_updated">
                                Profile updated
                            </option>

                            <option value="security_event">
                                Security event
                            </option>

                        </select>

                    </div>



                    <div class="activity-filter">

                        <select
                            id="activity-status"
                            aria-label="Filter by status"
                        >

                            <option value="">
                                All statuses
                            </option>

                            <option value="success">
                                Success
                            </option>

                            <option value="failed">
                                Failed
                            </option>

                            <option value="blocked">
                                Blocked
                            </option>

                            <option value="denied">
                                Denied
                            </option>

                        </select>

                    </div>


                </div>



                <!-- =================================================
                     ACTIVITY LIST
                     ================================================= -->

                <div
                    class="activity-list"
                    id="activity-list"
                >

                    <div class="activity-state">

                        <div class="activity-state-icon">

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                aria-hidden="true"
                            >

                                <path
                                    d="M5 12h4l2-7 3 14 2-7h3"
                                    stroke="currentColor"
                                    stroke-width="1.7"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                />

                            </svg>

                        </div>

                        <strong>
                            Loading activity...
                        </strong>

                        <span>
                            Retrieving your security activity.
                        </span>

                    </div>

                </div>



                <!-- =================================================
                     PAGINATION
                     ================================================= -->

                <div class="activity-pagination">


                    <div class="activity-page-info">

                        Page
                        <strong id="activity-page">
                            1
                        </strong>

                        <span>
                            of
                        </span>

                        <strong id="activity-pages">
                            1
                        </strong>

                    </div>


                    <div class="activity-page-buttons">

                        <button
                            type="button"
                            class="activity-page-button"
                            id="activity-prev"
                            disabled
                        >

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                aria-hidden="true"
                            >

                                <path
                                    d="m15 18-6-6 6-6"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                />

                            </svg>

                            Previous

                        </button>


                        <button
                            type="button"
                            class="activity-page-button"
                            id="activity-next"
                            disabled
                        >

                            Next

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                aria-hidden="true"
                            >

                                <path
                                    d="m9 18 6-6-6-6"
                                    stroke="currentColor"
                                    stroke-width="1.8"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                />

                            </svg>

                        </button>

                    </div>

                </div>


            </section>


        </section>


    </main>



    <!-- =========================================================
         JAVASCRIPT
         ========================================================= -->

    <script
        src="/js/sidebar.js?v=20261006-2000"
    ></script>

    <script
        src="/js/sidebar-toggle.js?v=20261006-2100"
    ></script>

    <script
        src="/js/activity.js?v=20261007-2300"
    ></script>


</body>

</html>
