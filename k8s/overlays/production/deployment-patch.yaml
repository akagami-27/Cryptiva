apiVersion: apps/v1
kind: Deployment
metadata:
  name: cryptiva
  namespace: cryptiva
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: cryptiva
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
