apiVersion: apps/v1
kind: Deployment
metadata:
  name: cryptiva
  namespace: cryptiva
  labels:
    app.kubernetes.io/name: cryptiva
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: cryptiva
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cryptiva
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
        - name: upload-tmp
          emptyDir:
            sizeLimit: 2Gi
      containers:
        - name: cryptiva
          image: cryptiva:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cryptiva-config
          env:
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: cryptiva-secrets
                  key: SESSION_SECRET
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cryptiva-secrets
                  key: JWT_SECRET
            - name: JWT_TTL_SECONDS
              value: "900"
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: cryptiva-secrets
                  key: MONGODB_URI
            - name: MASTER_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: cryptiva-secrets
                  key: MASTER_ENCRYPTION_KEY
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cryptiva-secrets
                  key: SUPABASE_URL
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  name: cryptiva-secrets
                  key: SUPABASE_SERVICE_ROLE_KEY
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 90
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: upload-tmp
              mountPath: /app/tmp
          resources:
            limits:
              cpu: "250m"
              memory: "512Mi"
