apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cryptiva
  namespace: cryptiva
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1050m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - cryptiva.smolelab.com
      secretName: cryptiva-tls
  rules:
    - host: cryptiva.smolelab.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cryptiva
                port:
                  number: 80
